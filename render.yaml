services:
  - type: web
    name: coloring-book-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: IMAGE_MODEL
        value: gpt-image-2
      - key: SITE_PASSWORD
        sync: false
      - key: JOB_TTL_HOURS
        value: "6"
